hydra:
  searchpath:
    - file://${oc.env:SPREADSHEET_RL_VERL_CONFIG_DIR,verl/verl/trainer/config}

defaults:
  - ppo_trainer
  - _self_

data:
  # 多轮工具调用的 system prompt + tool schema 本身就占数千 token，
  # 4096 会把几乎所有样本判为超长过滤掉（导致 num_samples=0 崩溃）
  max_prompt_length: 8192
  return_raw_chat: True

actor_rollout_ref:
  hybrid_engine: True
  rollout:
    name: vllm
    mode: async
    multi_turn:
      enable: True
      max_parallel_calls: 20
      max_serial_calls: 4
      max_tool_response_length: 10240

reward:
  reward_manager:
    name: rate_limited
